workflows:
  ios-release:
    name: iOS Release (Max Alpha Mobile)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.example.maxAlphaMobile"
    scripts:
      - name: Set up dependencies and Flutter packages
        script: |
          flutter pub get
      - name: Package Python app for iOS via serious_python
        script: |
          export SERIOUS_PYTHON_VERSION=3.12
          export SERIOUS_PYTHON_SITE_PACKAGES=$(pwd)/build/site-packages
          export SERIOUS_PYTHON_APP=$(pwd)/build/app
          export SERIOUS_PYTHON_BUNDLE_ID=$BUNDLE_ID
          dart run serious_python:main package agent \
            -p iOS \
            -r -r -r agent/requirements_ios.txt \
            --extra-index-url https://pypi.flet.dev
      - name: Build iOS App
        script: |
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
      - build/ios/ipa/*.ipa
